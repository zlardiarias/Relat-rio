<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades Diárias - SEPLAG / MPMA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #1d2d44;
        }

        /* Topbar institucional fixa ou de destaque de página inteira */
        .header-system {
            width: 100%;
            background: linear-gradient(135deg, #0b2545 0%, #134074 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid #8da9c4;
            box-shadow: 0 4px 12px rgba(11, 37, 69, 0.1);
        }

        .header-system img {
            max-width: 200px;
            height: auto;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .form-title {
            font-size: 18px;
            color: #ffffff;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Container principal ocupando o espaço central sem bordas flutuantes */
        .main-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            flex: 1;
        }

        .form-body {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #134074;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fcfdfe;
            color: #1d2d44;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #0b2545;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 37, 69, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            height: 110px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #0b2545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(11, 37, 69, 0.15);
        }

        .btn-submit:hover {
            background: #134074;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-system">
        <img src="logo-mpma.png" alt="Logo do Ministério Público do Estado do Maranhão">
        <div class="form-title">Relatório de Atividades Diárias da SEPLAG</div>
    </div>

    <div class="main-wrapper">
        <div class="form-body">
            <form action="#" method="POST">
                
                <div class="input-group">
                    <label for="nome">Nome do Servidor / Membro</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail Institucional</label>
                    <input type="email" id="email" name="email" placeholder="nome@mpma.mp.br" required>
                </div>

                <div class="input-group">
                    <label for="data">Data de Referência</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="input-group">
                    <label for="entregas">Principais Entregas / Atividades Concluídas no Dia</label>
                    <textarea id="entregas" name="entregas" placeholder="Descreva detalhadamente as entregas finalizadas..." required></textarea>
                </div>

                <div class="input-group">
                    <label for="demandas">Demandas em Andamento</label>
                    <textarea id="demandas" name="demandas" placeholder="Informe o status das demandas correntes e prazos..."></textarea>
                </div>

                <div class="input-group">
                    <label for="observacao">Observações / Intempéries / Pendências</label>
                    <textarea id="observacao" name="observacao" placeholder="Registros adicionais relevantes para o setor..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Relatório</button>
            </form>

            <div class="footer">
                Procuradoria-Geral de Justiça do Estado do Maranhão &bull; SEPLAG
            </div>
        </div>
    </div>

</body>
</html>
