<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Atividades - SEPLAG</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #3c4043; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 100px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #1557b0; }
        .alert-success { display: none; background: #d4edda; color: #155724; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .countdown-box { display: none; background: #fff3cd; color: #856404; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center; }
        .btn-cancel { background: #dc3545; margin-top: 10px; }
        .btn-cancel:hover { background: #bd2130; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Atividades - SEPLAG</h2>

        <div id="success-alert" class="alert-success">
            Relatório enviado e salvo com sucesso na planilha!
        </div>

        <div id="cancel-countdown-box" class="countdown-box">
            Enviando em <span id="contador">3</span> segundos...
            <button class="btn btn-cancel" onclick="cancelarEnvio()">Cancelar Envio</button>
        </div>

        <form id="form-atividade" onsubmit="iniciarContagem(event)">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail Institucional:</label>
                <input type="email" id="email" required placeholder="seu.email@seplag...">
            </div>

            <div class="form-group">
                <label for="data">Data de Referência:</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group">
                <label for="entregas">Principais Entregas / Atividades Realizadas:</label>
                <textarea id="entregas" required placeholder="Descreva o que foi realizado..."></textarea>
            </div>

            <div class="form-group">
                <label for="demandas">Demandas em Andamento:</label>
                <textarea id="demandas" placeholder="Descreva demandas pendentes ou em progresso..."></textarea>
            </div>

            <div class="form-group">
                <label for="observacao">Observações (Opcional):</label>
                <textarea id="observacao" placeholder="Informações adicionais..."></textarea>
            </div>

            <button type="submit" id="btn-submit" class="btn">Enviar Relatório</button>
        </form>
    </div>

    <script>
        let temporizador;
        let formularioPendente = null;

        function iniciarContagem(event) {
            event.preventDefault();
            formularioPendente = event.target;

            document.getElementById('btn-submit').style.display = 'none';
            const box = document.getElementById('cancel-countdown-box');
            box.style.display = 'block';

            let segundos = 3;
            document.getElementById('contador').innerText = segundos;

            temporizador = setInterval(() => {
                segundos--;
                document.getElementById('contador').innerText = segundos;

                if (segundos <= 0) {
                    clearInterval(temporizador);
                    box.style.display = 'none';
                    enviarDadosParaPlanilha();
                }
            }, 1000);
        }

        function cancelarEnvio() {
            clearInterval(temporizador);
            document.getElementById('cancel-countdown-box').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
        }

        function enviarDadosParaPlanilha() {
            const dadosForm = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                data: document.getElementById('data').value,
                entregas: document.getElementById('entregas').value,
                demandas: document.getElementById('demandas').value,
                observacao: document.getElementById('observacao').value
            };

            // COLE AQUI O LINK DO SEU WEB APP DO GOOGLE APPS SCRIPT
            const urlWebapp = "COLE_AQUI_A_URL_DO_SEU_WEB_APP";

            fetch(urlWebapp, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(dadosForm)
            })
            .then(() => {
                const alertBox = document.getElementById('success-alert');
                alertBox.style.display = 'block';
                formularioPendente.reset();
                document.getElementById('btn-submit').style.display = 'block';

                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            })
            .catch(error => {
                console.error('Erro no envio:', error);
                alert('Ocorreu um erro ao enviar o relatório. Verifique sua conexão.');
                document.getElementById('btn-submit').style.display = 'block';
            });
        }
    </script>
</body>
</html>
