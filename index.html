<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades Diárias - MPMA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        /* Container Principal com Estilo Institucional */
        .form-container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 8px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #003366; /* Azul Institucional */
        }

        /* Cabeçalho Institucional */
        .header-institutional {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .header-institutional h1 {
            font-size: 18px;
            color: #cc0000; /* Vermelho institucional */
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-institutional h2 {
            font-size: 15px;
            color: #003366; /* Azul institucional */
            margin: 5px 0 0 0;
            font-weight: 600;
        }

        .form-title {
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #4a5568;
            font-weight: 600;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fdfdfd;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #003366;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            height: 90px;
        }

        /* Botão de Envio */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #002244;
        }

        /* Rodapé Institucional */
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: #718096;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Cabeçalho com dados institucionais do MPMA -->
        <div class="header-institutional">
            <h1>Ministério Público</h1>
            <h2>Do Estado do Maranhão</h2>
        </div>

        <div class="form-title">Relatório de Atividades Diárias do Setor</div>

        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="nome">Nome do Servidor / Membro</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" id="email" name="email" placeholder="nome@mpma.mp.br" required>
            </div>

            <div class="input-group">
                <label for="data">Data de Referência</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="input-group">
                <label for="entregas">Principais Entregas / Atividades Concluídas no Dia</label>
                <textarea id="entregas" name="entregas" placeholder="Descreva detalhadamente as entregas finalizadas..." required></textarea>
            </div>

            <div class="input-group">
                <label for="demandas">Demandas em Andamento</label>
                <textarea id="demandas" name="demandas" placeholder="Informe o status das demandas correntes e prazos..."></textarea>
            </div>

            <div class="input-group">
                <label for="observacao">Observações / Intempéries / Pendências</label>
                <textarea id="observacao" name="observacao" placeholder="Registros adicionais relevantes para o setor..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Relatório</button>
        </form>

        <div class="footer">
            Procuradoria-Geral de Justiça do Estado do Maranhão &bull; Sistema de Gestão Setorial
        </div>
    </div>

</body>
</html>
