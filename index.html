<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades Diárias - MPMA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7; /* Fundo geral corporativo e suave */
            padding: 20px;
        }

        .form-container {
            background: #f4f7fb; /* Fundo interno a combinar com o tema do sistema */
            padding: 40px 35px;
            border-radius: 10px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 31, 63, 0.12);
            border: 1px solid #d0dbe7;
            border-top: 6px solid #0b2545; /* Azul institucional forte */
        }

        .header-institutional {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .header-institutional img {
            max-width: 240px;
            height: auto;
            margin-bottom: 12px;
        }

        .form-title {
            font-size: 17px;
            color: #0b2545;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #134074; /* Tom azulado coordenado para os rótulos */
            font-weight: 700;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #9ba8b7;
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff; /* APENAS AS CAIXAS DE SELEÇÃO/TEXTO BRANCAS */
            color: #1d2d44;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #0b2545;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 37, 69, 0.15);
        }

        .input-group textarea {
            resize: vertical;
            height: 95px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #0b2545; /* Botão elegante no tom do sistema */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(11, 37, 69, 0.2);
        }

        .btn-submit:hover {
            background: #134074;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #4a5568;
            border-top: 1px solid #cbd5e1;
            padding-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-institutional">
            <!-- Nota: Se o seu ficheiro no GitHub se chamar apenas logo.png, altere o src abaixo para "logo.png" -->
            <img src="logo-mpma.png" alt="Logo do Ministério Público do Estado do Maranhão">
        </div>

        <div class="form-title">Relatório de Atividades Diárias do Setor</div>

        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="nome">Nome do Servidor / Membro</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" id="email" name="email" placeholder="nome@mpma.mp.br" required>
            </div>

            <div class="input-group">
                <label for="data">Data de Referência</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="input-group">
                <label for="entregas">Principais Entregas / Atividades Concluídas no Dia</label>
                <textarea id="entregas" name="entregas" placeholder="Descreva detalhadamente as entregas finalizadas..." required></textarea>
            </div>

            <div class="input-group">
                <label for="demandas">Demandas em Andamento</label>
                <textarea id="demandas" name="demandas" placeholder="Informe o status das demandas correntes e prazos..."></textarea>
            </div>

            <div class="input-group">
                <label for="observacao">Observações / Intempéries / Pendências</label>
                <textarea id="observacao" name="observacao" placeholder="Registros adicionais relevantes para o setor..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Relatório</button>
        </form>

        <div class="footer">
            Procuradoria-Geral de Justiça do Estado do Maranhão &bull; Sistema de Gestão Setorial
        </div>
    </div>

</body>
</html>
