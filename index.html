<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Relatório</title>
    <!-- Adicione seus estilos CSS aqui se houver -->
</head>
<body>

    <div class="container">
        <h2>Relatório de Atividades</h2>
        
        <!-- Alerta de Sucesso -->
        <div id="success-alert" style="display: none; background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
            Relatório enviado com sucesso!
        </div>

        <!-- Caixa de Contagem Regressiva para Cancelamento -->
        <div id="cancel-countdown-box" style="display: none; background-color: #fff3cd; color: #856404; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
            Enviando em <span id="segundos-restantes">6</span> segundos... 
            <button type="button" onclick="cancelarEnvio()" style="margin-left: 10px; background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Cancelar</button>
        </div>

        <form id="report-form" onsubmit="iniciarContagemRegressiva(event)">
            <div>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label for="data">Data de Referência:</label><br>
                <input type="date" id="data" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label for="entregas">Principais Entregas:</label><br>
                <textarea id="entregas" rows="3" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>
            </div>
            <div>
                <label for="demandas">Demandas em Andamento:</label><br>
                <textarea id="demandas" rows="3" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>
            </div>
            <div>
                <label for="observacao">Observações:</label><br>
                <textarea id="observacao" rows="2" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>
            </div>

            <button type="submit" id="btn-submit" style="background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%;">Enviar Relatório</button>
        </form>
    </div>

    <script>
        let temporizador = null;
        let segundos = 6;
        let formularioPendente = null;

        function iniciarContagemRegressiva(event) {
            event.preventDefault(); 
            formularioPendente = event.target;

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const data = document.getElementById('data').value;
            const entregas = document.getElementById('entregas').value;

            if (!nome || !email || !data || !entregas) {
                alert('Por favor, preencha todos os campos obrigatórios antes de enviar.');
                return;
            }

            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('cancel-countdown-box').style.display = 'block';
            
            segundos = 6;
            document.getElementById('segundos-restantes').textContent = segundos;

            temporizador = setInterval(() => {
                segundos--;
                document.getElementById('segundos-restantes').textContent = segundos;

                if (segundos <= 0) {
                    clearInterval(temporizador);
                    document.getElementById('cancel-countdown-box').style.display = 'none';
                    
                    const dadosForm = {
                        nome: document.getElementById('nome').value,
                        email: document.getElementById('email').value,
                        data: document.getElementById('data').value,
                        entregas: document.getElementById('entregas').value,
                        demandas: document.getElementById('demandas').value,
                        observacao: document.getElementById('observacao').value
                    };

                    const urlWebapp = "SEU_LINK_DO_WEB_APP_AQUI"; // Cole o link atualizado do seu Web App do Google

                    fetch(urlWebapp, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify(dadosForm)
                    })
                    .then(() => {
                        const alertBox = document.getElementById('success-alert');
                        alertBox.style.display = 'block';
                        formularioPendente.reset();
                        document.getElementById('btn-submit').style.display = 'block';

                        setTimeout(() => {
                            alertBox.style.display = 'none';
                        }, 5000);
                    })
                    .catch(error => {
                        console.error('Erro no envio:', error);
                        alert('Ocorreu um erro ao enviar o relatório. Verifique sua conexão.');
                        document.getElementById('btn-submit').style.display = 'block';
                    });
                }
            }, 1000);
        }

        function cancelarEnvio() {
            clearInterval(temporizador);
            document.getElementById('cancel-countdown-box').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
        }
    </script>
</body>
</html>
